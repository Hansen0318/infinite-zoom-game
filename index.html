<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>山海經 · Infinite Zoom Puzzle</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090b12;color:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{touch-action:none}.app{height:100%;display:flex;flex-direction:column}.hud{height:76px;flex:0 0 76px;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#090b12}
.eyebrow{font-size:10px;letter-spacing:2px;opacity:.6;margin:0 0 3px}.hud h1{font-size:20px;margin:0}.progress{text-align:right}.progress strong{font-size:14px}.progress span{display:block;font-size:11px;opacity:.6;margin-top:3px}
.game{position:relative;flex:1;min-height:0;overflow:hidden;background:#111827}canvas{display:block;width:100%;height:100%;cursor:grab}.dragging{cursor:grabbing}
.hint{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);padding:9px 13px;border-radius:999px;background:#0009;font-size:12px;white-space:nowrap;pointer-events:none}
.entering{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:12px 18px;border-radius:999px;background:#0a0e18dd;border:1px solid #ffffff28;opacity:0;pointer-events:none;transition:.2s}.entering.show{opacity:1}
.finish[hidden]{display:none}.finish{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#04060c88;backdrop-filter:blur(3px);z-index:3}
.finish-card{width:min(88%,380px);padding:26px;border:1px solid #ffffff26;border-radius:22px;background:#0e121ef0;text-align:center}.finish-card h2{margin:0 0 8px}.finish-card p{line-height:1.6;color:#cbd5e1}
.finish-card button,.footer button{border:0;border-radius:10px;padding:10px 14px;background:#fff;color:#111;font-weight:700}
.footer{height:54px;flex:0 0 54px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:#090b12;font-size:11px;color:#8b93a7}.footer button{background:#1b2233;color:#fff;font-size:12px}
@media(max-width:560px){.hud{height:68px;flex-basis:68px;padding:10px 13px}.hud h1{font-size:17px}.hint{bottom:12px;font-size:11px}.footer{height:48px;flex-basis:48px}}
</style>
</head>
<body>
<div class="app">
<header class="hud">
  <div><p class="eyebrow">SHAN HAI JING · INFINITE ZOOM</p><h1>Hidden Worlds</h1></div>
  <div class="progress"><strong id="level">1 / 5</strong><span id="status">尋找入口</span></div>
</header>
<div class="game">
  <canvas id="canvas"></canvas>
  <div class="hint" id="hint">找到入口・拖到中央・持續 Zoom</div>
  <div class="entering" id="entering">進入下一層…</div>
  <div class="finish" id="finish" hidden>
    <div class="finish-card"><p class="eyebrow">WORLD COMPLETE</p><h2>第一關完成</h2>
      <p>你已穿越五層山海經 Infinite Zoom 世界。</p><button id="restart">重新探索</button>
    </div>
  </div>
</div>
<footer class="footer"><button id="reset">重置</button><span>山海經 · Demo 1</span></footer>
</div>

<script>
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
const levelEl=document.getElementById('level'),statusEl=document.getElementById('status');
const hint=document.getElementById('hint'),entering=document.getElementById('entering'),finish=document.getElementById('finish');
let dpr=1,level=0,scale=1,tx=0,ty=0,drag=false,lastX=0,lastY=0,lastDist=0,done=false,transitioning=false;
const INITIAL_SCALE=0.82,ENTRY_ZOOM=3.6,MAX_ZOOM=5.5,CENTER_TOL=70;
const layers=[
 ['巨龍','龍眼','#111d1a','#c9a66b'],
 ['龍眼中的森林','白澤','#18251e','#b8e0c2'],
 ['白澤','白澤之眼','#211b28','#ddd6fe'],
 ['眼中的天空','月亮','#111a31','#f6d365'],
 ['月亮世界','無盡之環','#0c0f18','#f8fafc']
];
const $=id=>document.getElementById(id),vw=()=>canvas.clientWidth,vh=()=>canvas.clientHeight,C=()=>({x:vw()/2,y:vh()/2});
const layer1Image=new Image(); layer1Image.src='layer1.png';
const layer2Image=new Image(); layer2Image.src='layer2.png';
const layer3Image=new Image(); layer3Image.src='layer3.png';
const layer4Image=new Image(); layer4Image.src='layer4.png';

function fitRect(img){
 const nw=img.naturalWidth,nh=img.naturalHeight;
 if(!nw||!nh)return{x:0,y:0,w:vw(),h:vh(),s:1};
 const s=Math.max(vw()/nw,vh()/nh),w=nw*s,h=nh*s;
 return{x:(vw()-w)/2,y:(vh()-h)/2,w,h,s};
}
function imageRect(){return fitRect(layer1Image)}
function activeImage(){
 return level===0?layer1Image:level===1?layer2Image:level===2?layer3Image:level===3?layer4Image:null;
}
function entry(){
 const w=vw(),h=vh();
 if(level===0&&layer1Image.complete&&layer1Image.naturalWidth){const r=imageRect();return{x:r.x+r.w*.580,y:r.y+r.h*.350}}
 if(level===1&&layer2Image.complete&&layer2Image.naturalWidth){const r=fitRect(layer2Image);return{x:r.x+r.w*.760,y:r.y+r.h*.540}}
 if(level===2&&layer3Image.complete&&layer3Image.naturalWidth){const r=fitRect(layer3Image);return{x:r.x+r.w*.490,y:r.y+r.h*.430}}
 if(level===3&&layer4Image.complete&&layer4Image.naturalWidth){const r=fitRect(layer4Image);return{x:r.x+r.w*.810,y:r.y+r.h*.110}}
 return{x:w/2,y:h/2};
}
function resize(){
 dpr=Math.min(devicePixelRatio||1,2);
 canvas.width=vw()*dpr;canvas.height=vh()*dpr;
 ctx.setTransform(dpr,0,0,dpr,0,0);render();
}
function start(){
 scale=(level===0||level===1)?INITIAL_SCALE:1;tx=0;ty=0;transitioning=false;
 levelEl.textContent=`${level+1} / 5`;
 statusEl.textContent='尋找入口';
 if(level===3)hint.textContent='找到下一層入口・把它移到中央再 Zoom';
 else hint.textContent=level===4?'找到無盡之環並放大':'找到下一層入口・把它移到中央再 Zoom';
 finish.hidden=true;render();
}
function marker(p){
 let a=layers[level][3],r=Math.min(vw(),vh())*.095;
 ctx.save();ctx.strokeStyle=a;ctx.globalAlpha=.28;ctx.lineWidth=10;
 ctx.beginPath();ctx.arc(p.x,p.y,r*1.35,0,7);ctx.stroke();
 ctx.globalAlpha=.9;ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(p.x,p.y,r,0,7);ctx.stroke();ctx.restore();
}
function drawScene(o){
 let bg=layers[level][2];ctx.fillStyle=bg;ctx.fillRect(0,0,vw(),vh());
 if(level===0&&layer1Image.complete&&layer1Image.naturalWidth){const r=imageRect();ctx.drawImage(layer1Image,r.x,r.y,r.w,r.h);return}
 if(level===1&&layer2Image.complete&&layer2Image.naturalWidth){const r=fitRect(layer2Image);ctx.drawImage(layer2Image,r.x,r.y,r.w,r.h);return}
 if(level===2&&layer3Image.complete&&layer3Image.naturalWidth){const r=fitRect(layer3Image);ctx.drawImage(layer3Image,r.x,r.y,r.w,r.h);return}
 if(level===3&&layer4Image.complete&&layer4Image.naturalWidth){const r=fitRect(layer4Image);ctx.drawImage(layer4Image,r.x,r.y,r.w,r.h);return}

 ctx.fillStyle='rgba(255,255,255,.035)';
 for(let i=0;i<65;i++){ctx.beginPath();ctx.arc((i*97+level*43)%vw(),(i*53+level*89)%vh(),1+i%3,0,7);ctx.fill()}
 let p=entry();
 if(level===0){
  ctx.strokeStyle='#4b665b';ctx.lineWidth=48;ctx.lineCap='round';ctx.beginPath();
  ctx.moveTo(o.x-270,o.y+160);ctx.bezierCurveTo(o.x-120,o.y+40,o.x-180,o.y-190,o.x+40,o.y-150);
  ctx.bezierCurveTo(o.x+210,o.y-120,o.x+270,o.y+40,o.x+140,o.y+170);ctx.stroke();
  ctx.fillStyle='#d8c7a2';ctx.beginPath();ctx.ellipse(p.x,p.y,55,38,-.2,0,7);ctx.fill();
  ctx.fillStyle='#111';ctx.beginPath();ctx.ellipse(p.x+5,p.y,12,25,0,0,7);ctx.fill();
 }
 if(level===1){
  ctx.fillStyle='#274634';for(let i=0;i<22;i++){ctx.beginPath();ctx.arc(i*113%vw(),70+i*71%(vh()*.55),28+i%4*9,0,7);ctx.fill()}
  ctx.fillStyle='#e8eee7';ctx.beginPath();ctx.ellipse(p.x,p.y,48,72,-.35,0,7);ctx.fill();
 }
 if(level===2){
  ctx.fillStyle='#e8e5ee';ctx.beginPath();ctx.ellipse(o.x,o.y+40,170,105,0,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(o.x-115,o.y-20,80,0,7);ctx.fill();ctx.beginPath();ctx.arc(o.x+115,o.y-20,80,0,7);ctx.fill();
  ctx.fillStyle='#b8a7d5';ctx.beginPath();ctx.arc(p.x,p.y,28,0,7);ctx.fill();
  ctx.fillStyle='#16121d';ctx.beginPath();ctx.arc(p.x,p.y,9,0,7);ctx.fill();
 }
 if(level===3){
  ctx.fillStyle='#25365c';ctx.beginPath();ctx.arc(o.x,o.y,230,0,7);ctx.fill();
  ctx.fillStyle='#9fb2d8';for(let i=0;i<35;i++){let a=i*1.71,r=90+i%8*38;ctx.beginPath();ctx.arc(o.x+Math.cos(a)*r,o.y+Math.sin(a)*r*.7,2+i%3,0,7);ctx.fill()}
  ctx.fillStyle='#f7d27a';ctx.beginPath();ctx.arc(p.x,p.y,58,0,7);ctx.fill();
 }
 if(level===4){
  ctx.fillStyle='#151a27';ctx.beginPath();ctx.arc(o.x,o.y,250,0,7);ctx.fill();
  ctx.strokeStyle='#f8fafc';ctx.lineWidth=9;ctx.beginPath();ctx.arc(p.x,p.y,95,0,7);ctx.stroke();
  ctx.fillStyle='#03050a';ctx.beginPath();ctx.arc(p.x,p.y,49,0,7);ctx.fill();
 }
 marker(p);
}
function render(){
 let o=C();ctx.clearRect(0,0,vw(),vh());
 ctx.save();ctx.translate(o.x+tx,o.y+ty);ctx.scale(scale,scale);ctx.translate(-o.x,-o.y);drawScene(o);ctx.restore();
}
function centered(){
 let p=entry(),o=C(),sx=o.x+(p.x-o.x)*scale+tx,sy=o.y+(p.y-o.y)*scale+ty;
 return Math.hypot(sx-o.x,sy-o.y)<CENTER_TOL;
}
function check(){
 if(!transitioning&&!done&&centered()&&scale>=ENTRY_ZOOM){
  transitioning=true;statusEl.textContent='進入下一層…';entering.classList.add('show');
  setTimeout(()=>{
   entering.classList.remove('show');
   if(level===4){done=true;finish.hidden=false;statusEl.textContent='第一關完成'}
   else{level++;start()}
  },550);
 }
}
function pan(dx,dy){
 tx+=dx;ty+=dy;
 const img=activeImage();
 if(img&&img.complete&&img.naturalWidth){
  const r=fitRect(img),w=r.w*scale,h=r.h*scale;
  const maxX=Math.max(0,(w-vw())/2+24),maxY=Math.max(0,(h-vh())/2+24);
  tx=Math.max(-maxX,Math.min(maxX,tx));ty=Math.max(-maxY,Math.min(maxY,ty));
 }else{
  let lim=260*scale;tx=Math.max(-lim,Math.min(lim,tx));ty=Math.max(-lim,Math.min(lim,ty));
 }
 render();check();
}
function zoomAt(f,x,y){
 let old=scale,next=Math.max(1,Math.min(MAX_ZOOM,scale*f)),o=C();
 let wx=(x-o.x-tx)/old,wy=(y-o.y-ty)/old;
 scale=next;tx=x-o.x-wx*scale;ty=y-o.y-wy*scale;
 const img=activeImage();
 if(img&&img.complete&&img.naturalWidth){
  const r=fitRect(img),w=r.w*scale,h=r.h*scale;
  const maxX=Math.max(0,(w-vw())/2+24),maxY=Math.max(0,(h-vh())/2+24);
  tx=Math.max(-maxX,Math.min(maxX,tx));ty=Math.max(-maxY,Math.min(maxY,ty));
 }
 render();check();
}
const pointers=new Map();
canvas.onpointerdown=e=>{
 pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});canvas.setPointerCapture(e.pointerId);
 if(pointers.size===1){drag=true;lastX=e.clientX;lastY=e.clientY;canvas.classList.add('dragging')}
 else if(pointers.size===2){const a=[...pointers.values()];lastDist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);drag=false}
};
canvas.onpointermove=e=>{
 if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(pointers.size===1&&drag){pan(e.clientX-lastX,e.clientY-lastY);lastX=e.clientX;lastY=e.clientY}
 else if(pointers.size===2){const a=[...pointers.values()];const d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(lastDist)zoomAt(d/lastDist,vw()/2,vh()/2);lastDist=d}
};
function endPointer(e){pointers.delete(e.pointerId);if(pointers.size<2)lastDist=0;if(pointers.size===0){drag=false;canvas.classList.remove('dragging')}}
canvas.onpointerup=endPointer;canvas.onpointercancel=endPointer;
canvas.onwheel=e=>{e.preventDefault();zoomAt(Math.exp(-e.deltaY*.001),e.offsetX,e.offsetY)};
$('reset').onclick=()=>{level=0;done=false;start()};
$('restart').onclick=()=>{level=0;done=false;start()};
addEventListener('resize',resize);
layer1Image.onload=render;layer2Image.onload=render;layer3Image.onload=render;layer4Image.onload=render;
start();resize();
</script>
</body>
</html>
